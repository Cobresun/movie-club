<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#222831" />
    <meta name="apple-mobile-web-app-title" content="Movie Club" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- Poppins is bundled (see src/main.ts), so its @font-face rules arrive
         with the app's own stylesheet. These two weights are on every screen
         (body text, the header wordmark); preloading them fetches the files
         alongside the script instead of after the first render asks for them.
         A font preload is always a CORS request, hence crossorigin. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource/poppins/files/poppins-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2"
      crossorigin
    />

    <title>Movie Club</title>

    <!-- Default Open Graph Meta Tags (overridden by edge function for shared reviews) -->
    <meta
      property="og:title"
      content="Movie Club - Review movies with your friends"
    />
    <meta
      property="og:description"
      content="Join clubs and review movies with your friends. Track ratings, manage watchlists, and discover great films together."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Movie Club" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="bg-background text-text">
    <noscript>
      <strong
        >We're sorry but Movie Club doesn't work properly without JavaScript
        enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
