name: CI

# Runs the repository quality gates (type-check, lint, test) that used to live
# inside the Netlify build command. Moving them here keeps them off Netlify's
# 300-min/month build budget — this is a public repo, so Actions minutes are
# free. Netlify now only migrates the DB and builds the site.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the in-flight run instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Kysely refuses to migrate out of order, and the deploy preview does not
      # catch it. The default checkout is shallow and has no origin/main.
      - name: Check migration order
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          npm run migrate:check-order
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run lint
      # The `integration` Vitest project starts a CockroachDB container with
      # testcontainers, so this step needs a Docker daemon. GitHub-hosted
      # `ubuntu-latest` runners ship one; a self-hosted runner would need it
      # installed, or `npm run test:unit` in its place.
      - run: npm test
