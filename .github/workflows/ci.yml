name: CI

# Runs the repository quality gates (type-check, lint, test). Migrating the DB
# and building the site is deploy.yml's job; both run in Actions, where this
# public repo's minutes are free, rather than on Netlify's build budget.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the in-flight run instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run lint
      # The `integration` Vitest project starts a CockroachDB container with
      # testcontainers, so this step needs a Docker daemon. GitHub-hosted
      # `ubuntu-latest` runners ship one; a self-hosted runner would need it
      # installed, or `npm run test:unit` in its place.
      - run: npm test
