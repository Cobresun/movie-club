[build]
# See netlify/build.sh for what the build actually does. Quality gates
# (type-check, lint, format, test) run in GitHub Actions
# (.github/workflows/ci.yml) so they don't burn Netlify build minutes.
#
# `timeout` is a spend guard, not a performance target. A build that stalls
# bills minutes until Netlify's own (much longer) timeout fires: two wedged
# deploy previews on 2026-07-24 ran 18 and 27 minutes and burned ~45 minutes —
# 13% of that month's 300-minute budget — producing nothing. The healthy range
# is a 46s median, ~190s for the migration-carrying previews that restore a
# database, so 10 minutes is far outside normal while capping the damage.
# Exit code 124 means the timeout fired.
command = "timeout 600 bash netlify/build.sh"

# Skip a preview rebuild when a push changes only files that cannot affect the
# deployed output — docs, Claude config, CI config, lint/format config, tests.
# Exit 0 = Netlify cancels the build; a non-empty diff of everything-else exits
# non-zero and the build proceeds. Errors (e.g. missing CACHED_COMMIT_REF on a
# first build) are treated as "build" by Netlify.
#
# Pathspecs use git's default (non-pathname) globbing, so `*` matches `/` and
# `*.test.ts` therefore matches at any depth. Keep build inputs like
# vite.config.ts OUT of this list — a wrongly excluded file leaves the preview
# silently serving stale code.
ignore = "git diff --quiet ${CACHED_COMMIT_REF} ${COMMIT_REF} -- . ':(exclude)*.md' ':(exclude).claude/' ':(exclude).github/' ':(exclude)*.test.ts' ':(exclude)*.test.tsx' ':(exclude)*.test.js' ':(exclude)*.spec.ts' ':(exclude)*/tests/*' ':(exclude)*/mocks/*' ':(exclude)oxlint.config.ts' ':(exclude).oxfmtrc.json' ':(exclude)coverage/'"

[[plugins]]
package = "./netlify/plugins/preview-database"

[[plugins]]
package = "./netlify/plugins/auth-config"

[functions]
# Include config files in function bundles
included_files = ["database-config.json", "auth-config.json"]

[[edge_functions]]
path = "/share/club/:clubSlug/review/:workId"
function = "shared-review"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
